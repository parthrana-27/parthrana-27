<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Arcade Contribution Games</title>
    <script src="https://cdn.jsdelivr.net/npm/pacman-contribution-graph/dist/pacman-contribution-graph.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }
        
        select, input {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            align-self: flex-end;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        #game-container {
            background: #0d1117;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            margin-top: 20px;
        }
        
        .loading {
            color: #999;
            font-size: 1.2em;
            text-align: center;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .stat-value {
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👻🧱🚀 Arcade Contribution Games</h1>
        <p class="subtitle">Turn your GitHub contributions into arcade games!</p>
        
        <div class="controls">
            <div class="control-group">
                <label for="game">Game:</label>
                <select id="game">
                    <option value="pacman">👻 Pac-Man</option>
                    <option value="breakout">🧱 Breakout</option>
                    <option value="galaga">🚀 Galaga</option>
                    <option value="puzzle-bobble">🫧 Puzzle Bobble</option>
                    <option value="bomberman">💣 Bomberman</option>
                    <option value="minesweeper">💠 Minesweeper</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="username">GitHub Username:</label>
                <input type="text" id="username" placeholder="parthrana-27" value="parthrana-27">
            </div>
            
            <div class="control-group">
                <label for="theme">Theme:</label>
                <select id="theme">
                    <option value="github">GitHub Light</option>
                    <option value="github-dark">GitHub Dark</option>
                </select>
            </div>
            
            <button onclick="playGame()">▶️ Play Game</button>
        </div>
        
        <div id="game-container">
            <div class="loading">Select a game and click "Play Game" to start 🎮</div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Steps</div>
                <div class="stat-value" id="steps">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="status">Ready</div>
            </div>
        </div>
    </div>
    
    <script>
        function playGame() {
            const game = document.getElementById('game').value;
            const username = document.getElementById('username').value;
            const theme = document.getElementById('theme').value;
            const container = document.getElementById('game-container');
            
            container.innerHTML = '<div class="loading">Loading game...</div>';
            document.getElementById('status').textContent = 'Loading...';
            
            setTimeout(() => {
                try {
                    const { ArcadeRenderer } = window;
                    
                    const renderer = new ArcadeRenderer({
                        game: game,
                        username: username,
                        platform: 'github',
                        gameTheme: theme,
                        svgCallback: (svg) => {
                            container.innerHTML = svg;
                            document.getElementById('status').textContent = 'Playing';
                        },
                        gameOverCallback: () => {
                            document.getElementById('status').textContent = 'Game Over!';
                            console.log('Game finished!');
                        },
                        pointsIncreasedCallback: (points) => {
                            document.getElementById('score').textContent = points;
                        },
                        gameStatsCallback: (stats) => {
                            document.getElementById('score').textContent = stats.totalScore;
                            document.getElementById('steps').textContent = stats.steps;
                            console.log('Game Stats:', stats);
                        }
                    });
                    
                    renderer.start();
                } catch (error) {
                    container.innerHTML = `<div class="loading" style="color: red;">Error: ${error.message}</div>`;
                    document.getElementById('status').textContent = 'Error';
                    console.error('Game Error:', error);
                }
            }, 100);
        }
        
        // Auto-play on load with default settings
        window.addEventListener('load', () => {
            setTimeout(playGame, 500);
        });
    </script>
</body>
</html>
